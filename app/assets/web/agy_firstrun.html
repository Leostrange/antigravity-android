<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Antigravity</title>
<style>
  :root {
    --bg: #101010; --fg: #ececec; --muted: #9d9d9d; --card: #191919;
    --border: #2a2a2a; --hover: #232323; --primary: #3b82f6; --primary-fg: #ffffff;
  }
  html.light {
    --bg: #ffffff; --fg: #101010; --muted: #5f6368; --card: #f6f7f9;
    --border: #e3e5e8; --hover: #eef0f3; --primary: #1a73e8; --primary-fg: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Google Sans", Roboto, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    overflow-y: auto;
  }
  .screen[hidden] { display: none; }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center;
             width: 100%; max-width: 480px; margin: 0 auto; }
  .logo { width: 56px; height: 56px; margin-bottom: 24px;
          background: center / contain no-repeat url("./agy_firstrun_logo.png"); }
  .step { color: var(--muted); font-size: 13px; letter-spacing: .02em; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; }
  p  { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
  .icon-badge { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
                background: var(--card); border: 1px solid var(--border); margin-bottom: 22px; }
  .icon-badge svg { width: 26px; height: 26px; fill: none; stroke: var(--primary); stroke-width: 1.8;
                    stroke-linecap: round; stroke-linejoin: round; }
  .actions { width: 100%; max-width: 480px; margin: 24px auto 0; display: grid; gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .primary, .secondary {
    width: 100%; min-height: 50px; border-radius: 12px; font-size: 15px; font-weight: 600;
  }
  .primary { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg); }
  .secondary { border: 1px solid var(--border); background: transparent; color: var(--fg); }
  .options { display: grid; gap: 12px; margin-top: 26px; }
  .option {
    display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 14px;
    width: 100%; min-height: 72px; padding: 14px 16px; text-align: left; color: inherit;
    border: 1px solid var(--border); border-radius: 14px; background: var(--card);
  }
  .option:active, .secondary:active { background: var(--hover); }
  .primary:active { filter: brightness(.92); }
  .option .badge { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 11px;
                   background: var(--bg); border: 1px solid var(--border); color: var(--muted);
                   font-size: 13px; font-weight: 700; }
  .option .badge svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .option strong { display: block; font-size: 17px; font-weight: 600; }
  .option small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .busy button { pointer-events: none; opacity: .6; }
</style>
</head>
<body>

<section class="screen" id="files" hidden>
  <div class="content">
    <div class="icon-badge"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
    <div class="step" data-t="step1"></div>
    <h1 data-t="filesTitle"></h1>
    <p data-t="filesBody"></p>
  </div>
  <div class="actions">
    <button class="primary" data-act="requestFiles" data-t="filesAllow"></button>
    <button class="secondary" data-act="skipFiles" data-t="later"></button>
  </div>
</section>

<section class="screen" id="notif" hidden>
  <div class="content">
    <div class="icon-badge"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
    <div class="step" data-t="step2"></div>
    <h1 data-t="notifTitle"></h1>
    <p data-t="notifBody"></p>
  </div>
  <div class="actions">
    <button class="primary" data-act="requestNotif" data-t="notifAllow"></button>
    <button class="secondary" data-act="skipNotif" data-t="later"></button>
  </div>
</section>

<section class="screen" id="lang" hidden>
  <div class="content">
    <div class="logo" aria-hidden="true"></div>
    <h1 data-t="langTitle"></h1>
    <p data-t="langBody"></p>
    <div class="options">
      <button class="option" data-act="chooseLang" data-arg="system">
        <span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
        <span><strong data-t="sysName"></strong><small data-t="sysHint"></small></span>
      </button>
      <button class="option" data-act="chooseLang" data-arg="ru">
        <span class="badge">RU</span>
        <span><strong>Русский</strong><small>Интерфейс на русском</small></span>
      </button>
      <button class="option" data-act="chooseLang" data-arg="en">
        <span class="badge">EN</span>
        <span><strong>English</strong><small>Interface in English</small></span>
      </button>
    </div>
  </div>
</section>

<script>
(function () {
  "use strict";
  var T = {
    ru: {
      step1: "Шаг 1 из 3", step2: "Шаг 2 из 3",
      filesTitle: "Доступ к файлам",
      filesBody: "Antigravity работает с проектами в памяти телефона: открывает, создаёт и изменяет файлы по вашей команде. Для этого Android попросит разрешить доступ ко всем файлам.",
      filesAllow: "Разрешить доступ к файлам",
      notifTitle: "Уведомления",
      notifBody: "Уведомления сообщают, что агент закончил задачу или ждёт подтверждения, и показывают, что ядро работает в фоне.",
      notifAllow: "Разрешить уведомления",
      later: "Не сейчас",
      langTitle: "Выберите язык",
      langBody: "Язык можно будет изменить в Настройках → Общие.",
      sysName: "Системный язык", sysHint: "Как в настройках Android"
    },
    en: {
      step1: "Step 1 of 3", step2: "Step 2 of 3",
      filesTitle: "File access",
      filesBody: "Antigravity works with projects in your phone storage: it opens, creates and edits files at your request. Android will ask you to allow access to all files.",
      filesAllow: "Allow file access",
      notifTitle: "Notifications",
      notifBody: "Notifications tell you when the agent finishes a task or needs your confirmation, and show that the core is running in the background.",
      notifAllow: "Allow notifications",
      later: "Not now",
      langTitle: "Choose a language",
      langBody: "You can change it later in Settings → General.",
      sysName: "System language", sysHint: "Same as Android settings"
    }
  };

  function params() {
    var out = {};
    (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }

  function render() {
    var p = params();
    var lang = /^ru\b/i.test(p.locale || navigator.language || "") ? "ru" : "en";
    var dict = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.classList.toggle("light", p.theme === "light");
    document.querySelectorAll("[data-t]").forEach(function (el) {
      el.textContent = dict[el.getAttribute("data-t")] || "";
    });
    // Files/notifications use the system windows directly (opened natively);
    // only the language choice has a screen of its own.
    var step = p.step === "lang" ? "lang" : "";
    document.querySelectorAll(".screen").forEach(function (s) { s.hidden = s.id !== step; });
    document.body.classList.remove("busy");
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-act]");
    if (!btn || document.body.classList.contains("busy")) return;
    document.body.classList.add("busy");
    // Re-enable after a moment in case the native side shows nothing (e.g. the
    // system dialog was suppressed); a real step change re-renders anyway.
    setTimeout(function () { document.body.classList.remove("busy"); }, 1500);
    try {
      window.AgyFirstRun.action(btn.getAttribute("data-act"), btn.getAttribute("data-arg") || "");
    } catch (err) {
      document.body.classList.remove("busy");
    }
  });

  window.addEventListener("hashchange", render);
  window.agyFirstRunRender = render;
  render();
})();
</script>
</body>
</html>
